name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # only what is committed: the deploy tree must not pick up _dev/, dist/ or
      # anything gitignored, and CI must publish exactly what the repo holds
      - name: Build deploy tree from the commit
        run: |
          mkdir -p dist
          git archive HEAD | tar -x -C dist
          find dist -type f | sort

      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name sizecut --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
